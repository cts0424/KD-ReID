# Shared defaults. Other configs inherit with `_base_: base.yaml` and override what they need.
seed: 42
output_dir: outputs/base

data:
  name: market1501
  root: /content/data            # Colab: dataset unzipped to local disk (fast), not read from Drive
  size: [256, 128]               # H, W
  batch_size: 64                 # = P identities x K instances
  num_instances: 4               # K
  test_batch_size: 256
  num_workers: 2                 # Colab gives 2 vCPUs
  aug: {flip: true, pad: 10, random_erasing: 0.5}

model:
  backbone: resnet50
  pretrained: true               # ImageNet weights from torchvision
  last_stride: 1
  neck: bnneck

loss:
  label_smooth: 0.1
  triplet_margin: 0.3
  ce_weight: 1.0
  triplet_weight: 1.0

kd:
  enabled: false

train:
  epochs: 120
  lr: 3.5e-4
  weight_decay: 5.0e-4
  warmup_epochs: 10
  milestones: [40, 70]
  gamma: 0.1
  amp: true
  eval_period: 10
  log_period: 50
  resume: true                   # auto-resume from output_dir/last.pth
